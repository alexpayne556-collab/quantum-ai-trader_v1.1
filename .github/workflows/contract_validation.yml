name: Contract Validation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'pattern_discovery_lab/**'
      - 'tests/test_contract_*.py'
      - '.github/workflows/contract_validation.yml'
  push:
    branches: [ main ]
    paths:
      - 'pattern_discovery_lab/**'
      - 'tests/test_contract_*.py'
  workflow_dispatch:

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy scipy
        if [ -f pattern_discovery_lab/requirements.txt ]; then
          pip install -r pattern_discovery_lab/requirements.txt
        fi
    
    - name: Run contract validator tests (happy path)
      run: |
        pytest tests/test_contract_validator.py -v --tb=short
    
    - name: Run mutation test suite
      run: |
        pytest tests/test_contract_mutations.py -v --tb=short
    
    - name: Validate current golden artifacts
      run: |
        # Create empty stderr for validation
        touch /tmp/empty_stderr.txt
        
        # Run validator CLI on golden artifacts
        python -m pattern_discovery_lab.contract_validator \
          --stdout pattern_discovery_lab/golden/stdout_canonical.txt \
          --results pattern_discovery_lab/golden/results_canonical.json \
          --stderr /tmp/empty_stderr.txt \
          --strict
    
    - name: Run deterministic test and validate output
      run: |
        # Run deterministic test
        python -m pattern_discovery_lab --run-all --seed 42 --n-surrogates 99 \
          > /tmp/test_stdout.txt 2> /tmp/test_stderr.txt
        
        # Find latest run directory
        RUN_DIR=$(ls -1dt pattern_discovery_lab/runs/* | head -n 1)
        
        # Validate output
        python -m pattern_discovery_lab.contract_validator \
          --stdout /tmp/test_stdout.txt \
          --results "$RUN_DIR/results.json" \
          --stderr /tmp/test_stderr.txt \
          --strict
    
    - name: Upload validation report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: validation-report
        path: |
          /tmp/test_stdout.txt
          /tmp/test_stderr.txt
          pattern_discovery_lab/runs/*/results.json
        retention-days: 7
